<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="monospace" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f0883e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">pe_unit - Processing Element Internals</text>

  <!-- Main PE border -->
  <rect x="20" y="42" width="760" height="370" rx="6" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Input labels -->
  <text x="5" y="85" fill="#3fb950" font-size="10" font-weight="bold">data_in [63:0]</text>
  <text x="5" y="155" fill="#3fb950" font-size="10" font-weight="bold">weight_in [63:0]</text>
  <text x="5" y="240" fill="#f0883e" font-size="10" font-weight="bold">thresh_in [15:0]</text>

  <!-- XNOR Gate -->
  <rect x="50" y="60" width="140" height="55" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="120" y="82" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">XNOR</text>
  <text x="120" y="100" text-anchor="middle" fill="#8b949e" font-size="9">~(data ^ weight)</text>

  <!-- Input arrows to XNOR -->
  <line x1="30" y1="80" x2="48" y2="80" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="30" y1="150" x2="48" y2="95" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- XNOR output -->
  <line x1="190" y1="87" x2="230" y2="87" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="80" text-anchor="middle" fill="#58a6ff" font-size="8">xnor [63:0]</text>

  <!-- Popcount -->
  <rect x="235" y="60" width="140" height="55" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="305" y="82" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Popcount</text>
  <text x="305" y="100" text-anchor="middle" fill="#8b949e" font-size="9">count_ones(xnor)</text>

  <!-- Popcount output -->
  <line x1="375" y1="87" x2="420" y2="87" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="80" text-anchor="middle" fill="#58a6ff" font-size="8">popcnt [6:0]</text>

  <!-- Sign Extend -->
  <rect x="425" y="65" width="90" height="44" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="470" y="84" text-anchor="middle" fill="#8b949e" font-size="10">Sign Ext</text>
  <text x="470" y="100" text-anchor="middle" fill="#8b949e" font-size="8">7->32 bit</text>

  <!-- Sign extend to accumulator -->
  <line x1="515" y1="87" x2="545" y2="87" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Accumulator -->
  <rect x="550" y="55" width="180" height="65" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Accumulator</text>
  <text x="640" y="96" text-anchor="middle" fill="#8b949e" font-size="9">acc_reg [31:0]</text>
  <text x="640" y="110" text-anchor="middle" fill="#8b949e" font-size="8">+ popcnt | reset on last</text>

  <!-- last_in_batch input -->
  <text x="5" y="320" fill="#f0883e" font-size="10" font-weight="bold">last_in_batch</text>
  <line x1="30" y1="315" x2="548" y2="315" stroke="#f0883e" stroke-width="1.5"/>
  <line x1="548" y1="315" x2="548" y2="122" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Accumulator to capture -->
  <line x1="640" y1="120" x2="640" y2="165" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Capture Register -->
  <rect x="550" y="170" width="180" height="55" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="640" y="192" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Capture Reg</text>
  <text x="640" y="210" text-anchor="middle" fill="#8b949e" font-size="9">acc_captured [31:0]</text>
  <text x="640" y="220" text-anchor="middle" fill="#8b949e" font-size="8">latched on last_in_batch</text>

  <!-- Threshold Comparison -->
  <rect x="490" y="260" width="200" height="65" rx="4" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="590" y="282" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Threshold Compare</text>
  <text x="590" y="300" text-anchor="middle" fill="#8b949e" font-size="9">acc_captured > thresh</text>
  <text x="590" y="315" text-anchor="middle" fill="#8b949e" font-size="8">Q4.12 fixed-point</text>

  <!-- Capture to Compare -->
  <line x1="640" y1="225" x2="640" y2="258" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Thresh to Compare -->
  <line x1="30" y1="235" x2="488" y2="235" stroke="#f0883e" stroke-width="1.5"/>
  <line x1="488" y1="235" x2="488" y2="280" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Outputs -->
  <line x1="690" y1="292" x2="740" y2="292" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="750" y="285" fill="#3fb950" font-size="10" font-weight="bold">binary_out</text>
  <text x="750" y="298" fill="#8b949e" font-size="8">(1 bit)</text>

  <line x1="730" y1="197" x2="740" y2="197" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="750" y="192" fill="#3fb950" font-size="10" font-weight="bold">acc_out</text>
  <text x="750" y="204" fill="#8b949e" font-size="8">[31:0]</text>

  <!-- valid_out -->
  <text x="750" y="345" fill="#3fb950" font-size="10" font-weight="bold">valid_out</text>
  <text x="750" y="358" fill="#8b949e" font-size="8">(1 bit, 1-cycle latency)</text>
  <rect x="660" y="340" width="2" height="10" fill="#3fb950"/>

  <!-- Data flow label -->
  <text x="400" y="420" text-anchor="middle" fill="#6e7681" font-size="10">Data path: 64-bit input -> 7-bit popcount -> 32-bit accumulation -> 1-bit binary output</text>
</svg>
