<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">bnn_top - Top Level Architecture</text>

  <!-- Top Module Border -->
  <rect x="20" y="45" width="860" height="445" rx="6" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="65" text-anchor="middle" fill="#8b949e" font-size="11">bnn_top</text>

  <!-- AXI-Lite Slave -->
  <rect x="40" y="85" width="180" height="70" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="110" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">axi_lite_slave</text>
  <text x="130" y="128" text-anchor="middle" fill="#8b949e" font-size="10">Configuration Registers</text>
  <text x="130" y="143" text-anchor="middle" fill="#8b949e" font-size="9">AXI-Lite Interface</text>

  <!-- AXI-Lite arrows (left side) -->
  <text x="8" y="100" fill="#3fb950" font-size="9">AXI-Lite</text>
  <text x="8" y="112" fill="#3fb950" font-size="9">Config</text>
  <line x1="28" y1="110" x2="38" y2="110" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Config bus from AXI-Lite to Ctrl FSM -->
  <line x1="220" y1="120" x2="280" y2="120" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="112" text-anchor="middle" fill="#f0883e" font-size="8">cfg_start, cfg_layers</text>

  <!-- Control FSM -->
  <rect x="280" y="85" width="180" height="70" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="370" y="110" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">ctrl_fsm</text>
  <text x="370" y="128" text-anchor="middle" fill="#8b949e" font-size="10">Layer Sequencing</text>
  <text x="370" y="143" text-anchor="middle" fill="#8b949e" font-size="9">7-State FSM</text>

  <!-- Weight ROM -->
  <rect x="530" y="85" width="180" height="70" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="620" y="110" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">weight_rom [0..7]</text>
  <text x="620" y="128" text-anchor="middle" fill="#8b949e" font-size="10">BRAM (64b/word)</text>
  <text x="620" y="143" text-anchor="middle" fill="#8b949e" font-size="9">Binary Weight Storage</text>

  <!-- Ctrl FSM to Weight ROM -->
  <line x1="460" y1="105" x2="528" y2="105" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="98" text-anchor="middle" fill="#f0883e" font-size="8">weight_addr</text>

  <!-- Input Buffer -->
  <rect x="40" y="200" width="180" height="70" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="225" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">input_buffer</text>
  <text x="130" y="243" text-anchor="middle" fill="#8b949e" font-size="10">256 x 64-bit FIFO</text>
  <text x="130" y="258" text-anchor="middle" fill="#8b949e" font-size="9">AXI-Stream In</text>

  <!-- AXI-Stream In arrow -->
  <text x="4" y="218" fill="#3fb950" font-size="9">AXI-S</text>
  <text x="4" y="230" fill="#3fb950" font-size="9">In</text>
  <line x1="28" y1="235" x2="38" y2="235" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input Buffer to PE Array -->
  <line x1="220" y1="235" x2="290" y2="235" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="228" text-anchor="middle" fill="#58a6ff" font-size="8">data_in [63:0]</text>

  <!-- Weight ROM to PE Array -->
  <line x1="620" y1="155" x2="620" y2="195" stroke="#f0883e" stroke-width="1.5"/>
  <line x1="620" y1="195" x2="480" y2="195" stroke="#f0883e" stroke-width="1.5"/>
  <line x1="480" y1="195" x2="480" y2="218" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="190" fill="#f0883e" font-size="8">weight_in [0..7]</text>

  <!-- PE Array -->
  <rect x="290" y="190" width="300" height="130" rx="4" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="440" y="212" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">PE Array (1-8 lanes)</text>

  <!-- Individual PEs -->
  <rect x="305" y="225" width="55" height="40" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="332" y="243" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">PE 0</text>
  <text x="332" y="256" text-anchor="middle" fill="#8b949e" font-size="7">XNOR+Pop</text>

  <rect x="370" y="225" width="55" height="40" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="397" y="243" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">PE 1</text>
  <text x="397" y="256" text-anchor="middle" fill="#8b949e" font-size="7">XNOR+Pop</text>

  <rect x="435" y="225" width="55" height="40" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="462" y="243" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">PE 2</text>
  <text x="462" y="256" text-anchor="middle" fill="#8b949e" font-size="7">XNOR+Pop</text>

  <text x="500" y="250" fill="#8b949e" font-size="14">...</text>

  <rect x="515" y="225" width="55" height="40" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="542" y="243" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">PE 7</text>
  <text x="542" y="256" text-anchor="middle" fill="#8b949e" font-size="7">XNOR+Pop</text>

  <!-- PE Array outputs -->
  <text x="350" y="290" fill="#8b949e" font-size="8">binary_out [0..7]  |  valid_out [0..7]</text>

  <!-- Ctrl FSM to PE Array -->
  <line x1="370" y1="155" x2="370" y2="188" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="175" fill="#bc8cff" font-size="8">last_in_batch</text>

  <!-- Output Pack -->
  <rect x="290" y="345" width="300" height="55" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="440" y="368" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Output Pack</text>
  <text x="440" y="383" text-anchor="middle" fill="#8b949e" font-size="9">PE outputs -> m_axis_tdata [7:0]</text>

  <!-- PE Array to Output Pack -->
  <line x1="440" y1="320" x2="440" y2="343" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output Pack to AXI-Stream Out -->
  <line x1="590" y1="372" x2="680" y2="372" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="365" fill="#3fb950" font-size="8">m_axis</text>

  <!-- AXI-Stream Out -->
  <rect x="685" y="345" width="160" height="55" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="765" y="368" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">AXI-Stream Out</text>
  <text x="765" y="383" text-anchor="middle" fill="#8b949e" font-size="9">Binary outputs</text>

  <!-- Status / IRQ -->
  <rect x="685" y="85" width="160" height="70" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="765" y="110" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Status / IRQ</text>
  <text x="765" y="128" text-anchor="middle" fill="#8b949e" font-size="9">irq_done</text>
  <text x="765" y="141" text-anchor="middle" fill="#8b949e" font-size="9">irq_error</text>

  <!-- Ctrl FSM to Status -->
  <line x1="460" y1="140" x2="683" y2="140" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="415" width="820" height="60" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="435" fill="#e6edf3" font-size="10" font-weight="bold">Legend:</text>
  <line x1="130" y1="432" x2="170" y2="432" stroke="#58a6ff" stroke-width="2"/>
  <text x="178" y="436" fill="#8b949e" font-size="9">Data path (64-bit)</text>
  <line x1="300" y1="432" x2="340" y2="432" stroke="#f0883e" stroke-width="2"/>
  <text x="348" y="436" fill="#8b949e" font-size="9">Weight/Address bus</text>
  <line x1="500" y1="432" x2="540" y2="432" stroke="#bc8cff" stroke-width="2"/>
  <text x="548" y="436" fill="#8b949e" font-size="9">Control signals</text>
  <line x1="680" y1="432" x2="720" y2="432" stroke="#3fb950" stroke-width="2"/>
  <text x="728" y="436" fill="#8b949e" font-size="9">AXI interfaces</text>
  <line x1="130" y1="455" x2="170" y2="455" stroke="#f85149" stroke-width="2"/>
  <text x="178" y="459" fill="#8b949e" font-size="9">Status / Interrupt</text>
</svg>
