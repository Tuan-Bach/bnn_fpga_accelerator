<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" font-family="monospace" font-size="12">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="200" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">XNOR-Popcount Data Path (per cycle)</text>

  <!-- Input A -->
  <rect x="20" y="55" width="100" height="40" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="70" y="72" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">data_in</text>
  <text x="70" y="86" text-anchor="middle" fill="#8b949e" font-size="8">64 bits</text>

  <!-- Input B -->
  <rect x="20" y="110" width="100" height="40" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="70" y="127" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">weight_in</text>
  <text x="70" y="141" text-anchor="middle" fill="#8b949e" font-size="8">64 bits</text>

  <!-- XOR -->
  <line x1="120" y1="75" x2="160" y2="75" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="120" y1="130" x2="160" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="165" y="65" width="80" height="50" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="205" y="86" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">XNOR</text>
  <text x="205" y="102" text-anchor="middle" fill="#8b949e" font-size="8">~(A ^ B)</text>

  <!-- XNOR to Popcount -->
  <line x1="245" y1="90" x2="290" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="268" y="82" text-anchor="middle" fill="#58a6ff" font-size="8">64b</text>

  <!-- Popcount -->
  <rect x="295" y="65" width="100" height="50" rx="4" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="345" y="86" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">Popcount</text>
  <text x="345" y="102" text-anchor="middle" fill="#8b949e" font-size="8">count 1-bits</text>

  <!-- Popcount to Accumulator -->
  <line x1="395" y1="90" x2="440" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="418" y="82" text-anchor="middle" fill="#58a6ff" font-size="8">7b</text>

  <!-- Accumulator -->
  <rect x="445" y="55" width="110" height="70" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="500" y="78" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Accumulator</text>
  <text x="500" y="95" text-anchor="middle" fill="#8b949e" font-size="8">acc += popcnt</text>
  <text x="500" y="108" text-anchor="middle" fill="#8b949e" font-size="8">32-bit signed</text>

  <!-- last_in_batch arrow -->
  <rect x="460" y="140" width="80" height="25" rx="3" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="500" y="157" text-anchor="middle" fill="#f0883e" font-size="8">last_in_batch</text>
  <line x1="500" y1="140" x2="500" y2="127" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Accumulator to Comparator -->
  <line x1="555" y1="90" x2="595" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Comparator -->
  <rect x="600" y="60" width="120" height="60" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="660" y="82" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">Comparator</text>
  <text x="660" y="98" text-anchor="middle" fill="#8b949e" font-size="8">acc > thresh?</text>

  <!-- Thresh input -->
  <rect x="620" y="140" width="80" height="25" rx="3" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="660" y="157" text-anchor="middle" fill="#f0883e" font-size="8">thresh Q4.12</text>
  <line x1="660" y1="140" x2="660" y2="122" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Output -->
  <line x1="720" y1="90" x2="740" y2="90" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="745" y="85" fill="#3fb950" font-size="10" font-weight="bold">1b</text>
  <text x="745" y="100" fill="#8b949e" font-size="8">binary</text>

  <!-- Example values -->
  <text x="375" y="190" text-anchor="middle" fill="#6e7681" font-size="9">Example: data=0xFF..FF, weight=0xFF..FF -> XNOR=0xFF..FF -> popcnt=64 -> acc+=64</text>
</svg>
